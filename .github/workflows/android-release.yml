name: Android Release
run-name: Android ${{ inputs.version_name }}+${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name (for example, 1.0.0)
        required: true
        default: 1.0.0
        type: string
      build_number:
        description: Android version code (positive integer)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release request
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
          TAGO_KEY: ${{ secrets.TAGO_KEY }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Android releases must run from the main branch."
            exit 1
          fi

          if [[ ! "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version_name must use a form such as 1.0.0 or 1.0.0-beta.1."
            exit 1
          fi

          if [[ ! "${BUILD_NUMBER}" =~ ^[1-9][0-9]{0,9}$ ]] ||
             (( 10#${BUILD_NUMBER} > 2100000000 )); then
            echo "::error::build_number must be between 1 and 2100000000."
            exit 1
          fi

          missing=()
          [[ -n "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]] || missing+=(ANDROID_RELEASE_KEYSTORE_BASE64)
          [[ -n "${ANDROID_RELEASE_STORE_PASSWORD}" ]] || missing+=(ANDROID_RELEASE_STORE_PASSWORD)
          [[ -n "${ANDROID_RELEASE_KEY_ALIAS}" ]] || missing+=(ANDROID_RELEASE_KEY_ALIAS)
          [[ -n "${ANDROID_RELEASE_KEY_PASSWORD}" ]] || missing+=(ANDROID_RELEASE_KEY_PASSWORD)
          [[ -n "${FIREBASE_ANDROID_CONFIG_BASE64}" ]] || missing+=(FIREBASE_ANDROID_CONFIG_BASE64)
          [[ -n "${TAGO_KEY}" ]] || missing+=(TAGO_KEY)

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required repository secrets: %s\n' "$(IFS=,; echo "${missing[*]}")"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-read-only: true
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check repository hygiene
        run: dart run tool/check_repository_hygiene.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Materialize and validate release credentials
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" |
            base64 --decode > android/upload-keystore.jks
          printf '%s' "${FIREBASE_ANDROID_CONFIG_BASE64}" |
            base64 --decode > android/app/google-services.json

          test -s android/upload-keystore.jks
          test -s android/app/google-services.json
          jq empty android/app/google-services.json

          if ! jq -e \
            --arg package_name 'com.kominsuk1064.kkuottae' \
            'any(.client[]?; .client_info.android_client_info.package_name == $package_name)' \
            android/app/google-services.json > /dev/null; then
            echo "::error::google-services.json does not contain com.kominsuk1064.kkuottae."
            exit 1
          fi

          if ! keytool -list \
            -keystore android/upload-keystore.jks \
            -storepass "${ANDROID_RELEASE_STORE_PASSWORD}" \
            -alias "${ANDROID_RELEASE_KEY_ALIAS}" > /dev/null; then
            echo "::error::The upload keystore, store password, or key alias is invalid."
            exit 1
          fi

      - name: Build signed release AAB
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          TAGO_KEY: ${{ secrets.TAGO_KEY }}
          ANDROID_RELEASE_STORE_FILE: upload-keystore.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build appbundle \
            --release \
            --build-name "${VERSION_NAME}" \
            --build-number "${BUILD_NUMBER}" \
            --dart-define="TAGO_KEY=${TAGO_KEY}" \
            --dart-define=CITY_CODE=33020

      - name: Verify and package release artifact
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          source_aab='build/app/outputs/bundle/release/app-release.aab'
          artifact_dir='build/release-artifacts'
          artifact_name="kku-ottae-${VERSION_NAME}+${BUILD_NUMBER}.aab"

          test -s "${source_aab}"
          if ! unzip -Z1 "${source_aab}" |
            grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "::error::The generated AAB does not contain a signing certificate."
            exit 1
          fi
          jarsigner -verify "${source_aab}" > /dev/null
          mkdir -p "${artifact_dir}"
          cp "${source_aab}" "${artifact_dir}/${artifact_name}"
          (
            cd "${artifact_dir}"
            sha256sum "${artifact_name}" > "${artifact_name}.sha256"
          )

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: kku-ottae-android-${{ inputs.version_name }}-${{ inputs.build_number }}
          path: build/release-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Write release summary
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          {
            echo '### Android release artifact'
            echo
            echo "- Version: \`${VERSION_NAME}+${BUILD_NUMBER}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- Contents: signed AAB and SHA-256 checksum'
            echo '- Retention: 14 days'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove release credentials
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f android/upload-keystore.jks
          rm -f android/app/google-services.json
